<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程详情 - 乡野课程助手</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #e8f5e9 0%, #fff8e1 50%, #e3f2fd 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .detail-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .detail-content {
      padding: 30px;
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .detail-title {
      font-size: 24px;
      color: var(--bamboo-green);
      margin: 0;
    }
    .detail-subject {
      background: var(--bamboo-green);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
    .detail-meta {
      font-size: 15px;
      color: var(--text-gray);
      margin-bottom: 24px;
    }
    .detail-section {
      margin-bottom: 24px;
    }
    .detail-section-title {
      font-size: 18px;
      color: var(--bamboo-green);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .detail-section-content {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-dark);
    }
    .related-link {
      display: block;
      padding: 10px 15px;
      background: #f0f9f4;
      border-radius: 10px;
      margin-bottom: 8px;
      color: var(--bamboo-green);
      text-decoration: none;
      font-size: 14px;
      transition: all 0.2s;
    }
    .related-link:hover {
      background: #e8f5e9;
      transform: translateX(5px);
    }
    .related-link::before {
      content: '🔗 ';
    }
    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--bamboo-green);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    .back-btn:hover {
      transform: translateY(-2px);
    }
    .loading-images {
      text-align: center;
      padding: 40px;
      color: var(--text-gray);
    }
    .keyword-tag {
      display: inline-block;
      background: #e8f5e9;
      color: var(--bamboo-green);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin: 4px;
    }
    .local-thing-banner {
      background: linear-gradient(135deg, var(--bamboo-green) 0%, var(--grass-green) 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .local-thing-banner h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }
    .local-thing-banner p {
      margin: 0;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="detail-app">
    <div class="detail-container">
      <div class="local-thing-banner">
        <h2>🌾 乡野课程助手</h2>
        <p>基于本地事物生成的跨学科课程方案</p>
      </div>
      <div class="detail-content">
        <div class="detail-header">
          <h1 class="detail-title" id="course-title">加载中...</h1>
          <span class="detail-subject" id="course-subject">-</span>
        </div>
        <div class="detail-meta">
          <span id="course-grade">适合年级：-</span>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">🔍 核心知识点</div>
          <div class="detail-section-content" id="course-knowledge">-</div>
        </div>

        <div id="keywords-section" class="detail-section">
          <div class="detail-section-title">📁 相关关键词</div>
          <div id="keywords-container"></div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">📝 活动步骤</div>
          <div class="detail-section-content" id="course-steps">-</div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">❓ 延伸问题</div>
          <div class="detail-section-content" id="course-question">-</div>
        </div>

        <div class="detail-section" id="knowledge-section" style="display:none;">
          <div class="detail-section-title">📚 知识库</div>
          <div class="detail-section-content" id="course-knowledge-base">-</div>
        </div>

        <div class="detail-section" id="links-section" style="display:none;">
          <div class="detail-section-title">🔗 相关链接</div>
          <div id="course-links"></div>
        </div>

        <a href="index.html" class="back-btn">← 返回首页</a>
      </div>
    </div>
  </div>

  <script>
    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function formatSteps(steps) {
      if (Array.isArray(steps)) {
        return steps.map((s, i) => {
          const cleanStep = String(s).replace(/^\d+[.、)]\s*/, '');
          return `${i + 1}. ${cleanStep}`;
        }).join('<br>');
      }
      if (typeof steps === 'string') {
        const lines = steps.split('\n').filter(line => line.trim());
        return lines.map((line, i) => {
          const cleanLine = line.replace(/^\d+[.、)]\s*/, '');
          return `${i + 1}. ${cleanLine}`;
        }).join('<br>');
      }
      return String(steps);
    }

    function extractKeywords(course, localThing) {
      const keywords = [];
      if (localThing) keywords.push(localThing);
      if (course.学科 || course.subject) keywords.push(course.学科 || course.subject);
      if (course.课程名称 || course.name) {
        const name = course.课程名称 || course.name;
        keywords.push(name.replace(/观察|日记|课|科学|奥秘/g, ''));
      }
      if (course.核心知识点 || course.knowledge) {
        const kn = (course.核心知识点 || course.knowledge).split(/[，,、]/);
        keywords.push(...kn.slice(0, 3));
      }
      return keywords.filter(k => k && k.length > 1).slice(0, 6);
    }

    function init() {
      const dataParam = getUrlParam('data');
      if (!dataParam) {
        document.getElementById('course-title').textContent = '无效的课程数据';
        return;
      }

      try {
        const { course, localThing } = JSON.parse(decodeURIComponent(dataParam));

        document.getElementById('course-title').textContent = course.课程名称 || course.name || '未命名课程';
        document.getElementById('course-subject').textContent = course.学科 || course.subject || '综合';
        document.getElementById('course-grade').textContent = `适合年级：${course.适合年级 || course.grade || '未知'}`;
        document.getElementById('course-knowledge').textContent = course.核心知识点 || course.knowledge || '无';
        document.getElementById('course-steps').innerHTML = formatSteps(course.活动步骤 || course.steps);
        document.getElementById('course-question').textContent = course.延伸问题 || course.question || '无';

        const keywords = extractKeywords(course, localThing);
        document.getElementById('keywords-container').innerHTML = keywords.map(k =>
          `<span class="keyword-tag">${k}</span>`
        ).join('');

        const knowledgeBase = course.知识库 || course.knowledgeBase;
        if (knowledgeBase) {
          document.getElementById('course-knowledge-base').textContent = knowledgeBase;
          document.getElementById('knowledge-section').style.display = 'block';
        }

        const links = course.相关链接 || course.relatedLinks;
        if (links && Array.isArray(links) && links.length > 0) {
          document.getElementById('course-links').innerHTML = links.map(link =>
            `<a class="related-link" href="${link.url}" target="_blank" rel="noopener">${link.name}</a>`
          ).join('');
          document.getElementById('links-section').style.display = 'block';
        }

      } catch (e) {
        console.error('解析失败:', e);
        document.getElementById('course-title').textContent = '数据加载失败';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
