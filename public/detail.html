<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>课程详情 - 乡野课程助手</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: linear-gradient(135deg, #e8f5e9 0%, #fff8e1 50%, #e3f2fd 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .detail-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      overflow: hidden;
    }
    .hero-image {
      width: 100%;
      height: 300px;
      object-fit: cover;
      background: linear-gradient(135deg, #4a7c59 0%, #90b77d 100%);
    }
    .detail-content {
      padding: 30px;
    }
    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .detail-title {
      font-size: 24px;
      color: var(--bamboo-green);
      margin: 0;
    }
    .detail-subject {
      background: var(--bamboo-green);
      color: white;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 14px;
    }
    .detail-meta {
      font-size: 15px;
      color: var(--text-gray);
      margin-bottom: 24px;
    }
    .detail-section {
      margin-bottom: 24px;
    }
    .detail-section-title {
      font-size: 18px;
      color: var(--bamboo-green);
      margin-bottom: 12px;
      font-weight: 600;
    }
    .detail-section-content {
      font-size: 15px;
      line-height: 1.8;
      color: var(--text-dark);
    }
    .image-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 24px 0;
    }
    .gallery-image {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
      transition: transform 0.3s;
    }
    .gallery-image:hover {
      transform: scale(1.05);
    }
    .back-btn {
      display: inline-block;
      padding: 12px 24px;
      background: var(--bamboo-green);
      color: white;
      text-decoration: none;
      border-radius: 25px;
      margin-top: 20px;
      transition: transform 0.2s;
    }
    .back-btn:hover {
      transform: translateY(-2px);
    }
    .loading-images {
      text-align: center;
      padding: 40px;
      color: var(--text-gray);
    }
    .keyword-tag {
      display: inline-block;
      background: #e8f5e9;
      color: var(--bamboo-green);
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      margin: 4px;
    }
    .local-thing-banner {
      background: linear-gradient(135deg, var(--bamboo-green) 0%, var(--grass-green) 100%);
      color: white;
      padding: 20px;
      text-align: center;
    }
    .local-thing-banner h2 {
      margin: 0 0 8px 0;
      font-size: 20px;
    }
    .local-thing-banner p {
      margin: 0;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div id="detail-app">
    <div class="detail-container">
      <img id="hero-image" class="hero-image" src="" alt="课程配图">
      <div class="local-thing-banner">
        <h2>🌾 乡野课程助手</h2>
        <p>基于本地事物生成的跨学科课程方案</p>
      </div>
      <div class="detail-content">
        <div class="detail-header">
          <h1 class="detail-title" id="course-title">加载中...</h1>
          <span class="detail-subject" id="course-subject">-</span>
        </div>
        <div class="detail-meta">
          <span id="course-grade">适合年级：-</span>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">🔍 核心知识点</div>
          <div class="detail-section-content" id="course-knowledge">-</div>
        </div>

        <div id="keywords-section" class="detail-section">
          <div class="detail-section-title">📁 相关关键词</div>
          <div id="keywords-container"></div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">📝 活动步骤</div>
          <div class="detail-section-content" id="course-steps">-</div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">❓ 延伸问题</div>
          <div class="detail-section-content" id="course-question">-</div>
        </div>

        <div class="detail-section">
          <div class="detail-section-title">🖼️ 相关图片</div>
          <div id="image-gallery" class="image-gallery">
            <div class="loading-images">正在加载图片...</div>
          </div>
        </div>

        <a href="index.html" class="back-btn">← 返回首页</a>
      </div>
    </div>
  </div>

  <script>
    const UNSPLASH_ACCESS_KEY = 'demo';
    const FALLBACK_IMAGES = [
      'https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=800',
      'https://images.unsplash.com/photo-1500673922987-e212871fec22?w=800',
      'https://images.unsplash.com/photo-1518623001395-125242310d0c?w=800',
      'https://images.unsplash.com/photo-1473773508845-188df298d2d1?w=800'
    ];

    function getUrlParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }

    function formatSteps(steps) {
      if (Array.isArray(steps)) {
        return steps.map((s, i) => `${i + 1}. ${s}`).join('<br>');
      }
      if (typeof steps === 'string') {
        return steps.replace(/\n/g, '<br>').replace(/(\d+)\.\s*/g, '<b>$1.</b> ');
      }
      return String(steps);
    }

    function extractKeywords(course, localThing) {
      const keywords = [];
      if (localThing) keywords.push(localThing);
      if (course.学科 || course.subject) keywords.push(course.学科 || course.subject);
      if (course.课程名称 || course.name) {
        const name = course.课程名称 || course.name;
        keywords.push(name.replace(/观察|日记|课|科学|奥秘/g, ''));
      }
      if (course.核心知识点 || course.knowledge) {
        const kn = (course.核心知识点 || course.knowledge).split(/[，,、]/);
        keywords.push(...kn.slice(0, 3));
      }
      return keywords.filter(k => k && k.length > 1).slice(0, 6);
    }

    function getSearchQuery(keywords) {
      return keywords.join(' ');
    }

    async function fetchImages(query) {
      try {
        const response = await fetch(`https://api.unsplash.com/search/photos?query=${encodeURIComponent(query)}&per_page=4`, {
          headers: {
            'Authorization': `Client-ID ${UNSPLASH_ACCESS_KEY}`
          }
        });
        if (!response.ok) throw new Error('API error');
        const data = await response.json();
        return data.results.map(r => r.urls.regular);
      } catch (e) {
        return getRandomFallbackImages(4);
      }
    }

    function getRandomFallbackImages(count) {
      const shuffled = [...FALLBACK_IMAGES].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, count);
    }

    function renderImages(images) {
      const gallery = document.getElementById('image-gallery');
      gallery.innerHTML = images.map(url =>
        `<img class="gallery-image" src="${url}" alt="相关图片" loading="lazy">`
      ).join('');
    }

    function init() {
      const dataParam = getUrlParam('data');
      if (!dataParam) {
        document.getElementById('course-title').textContent = '无效的课程数据';
        return;
      }

      try {
        const { course, localThing } = JSON.parse(decodeURIComponent(dataParam));

        document.getElementById('course-title').textContent = course.课程名称 || course.name || '未命名课程';
        document.getElementById('course-subject').textContent = course.学科 || course.subject || '综合';
        document.getElementById('course-grade').textContent = `适合年级：${course.适合年级 || course.grade || '未知'}`;
        document.getElementById('course-knowledge').textContent = course.核心知识点 || course.knowledge || '无';
        document.getElementById('course-steps').innerHTML = formatSteps(course.活动步骤 || course.steps);
        document.getElementById('course-question').textContent = course.延伸问题 || course.question || '无';

        const keywords = extractKeywords(course, localThing);
        document.getElementById('keywords-container').innerHTML = keywords.map(k =>
          `<span class="keyword-tag">${k}</span>`
        ).join('');

        const heroKeywords = [localThing, course.学科 || course.subject].filter(Boolean).join(' ');
        document.getElementById('hero-image').src = getRandomFallbackImages(1)[0];

        renderImages(FALLBACK_IMAGES);

      } catch (e) {
        console.error('解析失败:', e);
        document.getElementById('course-title').textContent = '数据加载失败';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
